<!-- Link público /agenda-online/<codigoID>: fixa a base em "/" pros assets relativos
     carregarem da RAIZ (senão o navegador pede /agenda-online/js/... e recebe HTML). -->
<script>
  if (location.pathname.indexOf('/agenda-online/') === 0) document.write('<base href="/">');
</script>

<!-- Force-update: unregister → re-register → SW ready → reload -->
<script>
  (function() {
    var V='856';
    window.__BUILD = V;   // exibido em Ajustes: encerra a dúvida de 'a atualização chegou?'
    if (localStorage.getItem('_visao_build') !== V) {
      localStorage.setItem('_visao_build', V);
      if ('caches' in window) {
        // Os vídeos de prova guardados no celular ficam (falcon-provas): baixar de novo gasta o tráfego
        caches.keys().then(function(ks) { ks.forEach(function(k) { if (k.indexOf('falcon-provas') !== 0) caches.delete(k); }); });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs) {
          Promise.all(rs.map(function(r) { return r.unregister(); })).then(function() {
            return navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
          }).then(function() {
            return navigator.serviceWorker.ready;
          }).then(function() {
            window.location.reload(true);
          }).catch(function() {
            window.location.reload(true);
          });
        });
      } else {
        window.location.reload(true);
      }
    }
  })();
</script>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/styles.css?v=20261111a">
<style>.onboarding-logo,.ajustes-avatar{background:#4f46e5!important}</style>
<script>
  // Aplica tema ANTES de qualquer render — evita flash de tema errado
  (function() {
    var saved = localStorage.getItem('visao_theme');
    // Dark-first: sem escolha salva, abre no ESCURO (não segue o modo claro do
    // sistema). Reinstalar limpa o localStorage e caía no claro sem querer.
    var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script type="module" src="js/inicializador.js?v=20261024b"></script>

  <!-- Registro do Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(err => {
          console.warn('[Visão] SW registration failed:', err);
        });
      });
    }
  </script>
</body>
