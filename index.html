<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Assistente Pessoal de Planejamento Estratégico — organize sua rotina e acompanhe seu desempenho.">
<title>Falcon — Assistente Pessoal de Planejamento Estratégico</title>

<!-- Force-update: unregister → re-register → SW ready → reload -->
<script>
  (function() {
    var V = '194';
    if (localStorage.getItem('_visao_build') !== V) {
      localStorage.setItem('_visao_build', V);
      if ('caches' in window) {
        caches.keys().then(function(ks) { ks.forEach(function(k) { caches.delete(k); }); });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs) {
          Promise.all(rs.map(function(r) { return r.unregister(); })).then(function() {
            return navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
          }).then(function() {
            return navigator.serviceWorker.ready;
          }).then(function() {
            window.location.reload(true);
          }).catch(function() {
            window.location.reload(true);
          });
        });
      } else {
        window.location.reload(true);
      }
    }
  })();
</script>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Falcon">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css?v=20260715d">
<style>.onboarding-logo,.ajustes-avatar{background:#4f46e5!important}</style>
<script>
  // Aplica tema ANTES de qualquer render — evita flash de tema errado
  (function() {
    var saved = localStorage.getItem('visao_theme');
    var theme = (saved === 'dark' || saved === 'light')
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <div id="app">
    <div style="padding:80px 20px;text-align:center;color:var(--muted)">
      <img src="icons/icon-192.png?v=20260715d" style="width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 14px;object-fit:cover;">
      <div>Carregando Falcon...</div>
    </div>
  </div>
  <script type="module" src="js/inicializador.js?v=20260715d"></script>

  <!-- Registro do Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(err => {
          console.warn('[Visão] SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
