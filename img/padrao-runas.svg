  <!-- Ladrilho de hieróglifos e runas para o fundo da conversa.
       Desenhado em traço, não em texto: hieróglifo egípcio Unicode depende de
       fonte instalada e no Android costuma virar quadradinho.

       GRADE RETA de 6 colunas (x=25..275, passo 50) por 8 linhas (y=19..281,
       passo ~37,5). Cada glifo é desenhado CENTRADO na própria origem, então
       as colunas descem em linha reta.

       O QUE VARIA é qual glifo cai em cada casa: a sequência é deslocada a
       cada linha, senão a mesma figura desceria sempre na mesma coluna.

       O olho de Hórus NÃO está aqui — ele é a imagem original do Elton e
       entra como camada separada no CSS, em 4 posições de LINHAS e COLUNAS
       diferentes, pra nunca formar faixa horizontal.

       ESTE ARQUIVO É A FONTE: o CSS não o carrega, ele vai EMBUTIDO como data
       URI em styles.css (imagem separada não chegava no aparelho por causa do
       cache-first do service worker). Mudou aqui, gerar o data URI de novo. -->
