<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Ladrilho de hieróglifos e runas para o fundo da conversa.
       Desenhado em traço, não em texto: hieróglifo egípcio Unicode depende de
       fonte instalada e no Android costuma virar quadradinho. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- ankh -->
    <g transform="translate(18,14)">
      <ellipse cx="0" cy="0" rx="5" ry="6"/>
      <path d="M0 6 V22 M-7 12 H7"/>
    </g>

    <!-- runa Algiz -->
    <g transform="translate(62,16)">
      <path d="M0 0 V20 M0 6 L-7 -2 M0 6 L7 -2"/>
    </g>

    <!-- olho de Hórus simplificado -->
    <g transform="translate(108,18)">
      <path d="M-10 2 Q0 -7 10 2 Q0 9 -10 2 Z"/>
      <circle cx="0" cy="2" r="2.4"/>
      <path d="M6 6 Q10 12 4 13"/>
    </g>

    <!-- água (n) -->
    <g transform="translate(14,54)">
      <path d="M0 0 q4 -5 8 0 t8 0 t8 0"/>
    </g>

    <!-- runa Fehu -->
    <g transform="translate(58,50)">
      <path d="M0 0 V20 M0 3 L9 -2 M0 11 L9 6"/>
    </g>

    <!-- pena / junco -->
    <g transform="translate(104,50)">
      <path d="M4 22 V2 M4 4 q7 3 4 9 q-3 5 -4 3"/>
    </g>

    <!-- runa Thurisaz -->
    <g transform="translate(20,92)">
      <path d="M0 0 V20 M0 4 L8 8 L0 12 Z"/>
    </g>

    <!-- disco solar com asas (bem reduzido) -->
    <g transform="translate(62,96)">
      <circle cx="0" cy="0" r="4"/>
      <path d="M-4 0 q-9 -5 -14 0 M4 0 q9 -5 14 0"/>
    </g>

    <!-- runa Ehwaz -->
    <g transform="translate(112,90)">
      <path d="M0 20 V4 L7 0 L14 4 V20"/>
    </g>

    <!-- escaravelho estilizado -->
    <g transform="translate(22,126)">
      <ellipse cx="0" cy="0" rx="6" ry="8"/>
      <path d="M0 -8 V8 M-6 -3 L-11 -6 M6 -3 L11 -6 M-6 3 L-11 6 M6 3 L11 6"/>
    </g>

    <!-- runa Dagaz -->
    <g transform="translate(66,124)">
      <path d="M0 -7 L12 7 M0 7 L12 -7 M0 -7 V7 M12 -7 V7"/>
    </g>

    <!-- obelisco -->
    <g transform="translate(116,120)">
      <path d="M-4 12 V-6 L0 -12 L4 -6 V12 Z"/>
    </g>
  </g>
</svg>
